<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste Realiser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
<div class="grand-pah">
    <div class="tite">
        <h1>Ma Bucket-list</h1>
        <p>Organise tes projets concrets et tes reves les plus fous</p>
    </div>

    <div class="parent">

    <div class="enfant">
        <h2><strong>Projets concrets</strong></h2>
        <p> A realiser cette annee</p>
        <input type="text" id="projet" placeholder="saisir un projet concret">
        <button id="btnProjet">Ajouter</button>

        <div id="listeProjets"></div>
    </div>

    <div class="enfant">
        <h2><strong>Reves de vie</strong></h2>
        <p>un jour peut etre </p>
        <input type="text" id="reve" placeholder="saisir un reve fou">
        <button id="btnReve" style="background-color: blueviolet;">Ajouter</button>

        <div id="listeReves"></div>
    </div>

</div>
</div>
<script src="script.js"></script>
</body>
</html>
